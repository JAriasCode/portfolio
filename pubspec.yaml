name: portfolio
description: "Personal portfolio of Jeffry Arias, Flutter engineer. Built in Flutter for web."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  # Official JS-interop bindings, used only to open external links on web.
  # Deliberately the single third-party dependency of the site.
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  # Self-hosted type. Chillax (display) and Supreme (text) come from
  # Fontshare / Indian Type Foundry under the FFL. Fragment Mono is OFL.
  fonts:
    - family: Chillax
      fonts:
        - asset: assets/fonts/Chillax-Regular.ttf
          weight: 400
        - asset: assets/fonts/Chillax-Medium.ttf
          weight: 500
        - asset: assets/fonts/Chillax-Semibold.ttf
          weight: 600
        - asset: assets/fonts/Chillax-Bold.ttf
          weight: 700
    - family: Supreme
      fonts:
        - asset: assets/fonts/Supreme-Regular.ttf
          weight: 400
        - asset: assets/fonts/Supreme-Medium.ttf
          weight: 500
        - asset: assets/fonts/Supreme-Bold.ttf
          weight: 700
        - asset: assets/fonts/Supreme-Extrabold.ttf
          weight: 800
    - family: FragmentMono
      fonts:
        - asset: assets/fonts/FragmentMono-Regular.ttf
          weight: 400
